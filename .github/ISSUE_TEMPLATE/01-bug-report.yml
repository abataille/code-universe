name: Bug report
description: Report a reproducible Code Universe problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove private source, credentials, customer data, and identifying repository paths before submitting.
  - type: input
    id: version
    attributes:
      label: Code Universe version
      description: Use the app version, release tag, or commit hash.
      placeholder: 0.2.0 or a commit hash
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and hardware
      placeholder: macOS 15.6, Apple M2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Repository scanning
        - Architecture map
        - Source navigation
        - Parser comparison
        - AI-agent review
        - Licence activation
        - Packaging or launch
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the problem.
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only logs, screenshots, or a minimal public fixture that contains no sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private source, credentials, customer data, and identifying paths.
          required: true
        - label: This is not a security vulnerability.
          required: true
