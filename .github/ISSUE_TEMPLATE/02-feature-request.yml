name: Feature request
description: Propose an outcome-focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow
      description: What repository-understanding or review task are you trying to complete?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Where does the current workflow become slow, uncertain, or unsafe?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result you need without prescribing a particular UI.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary user
      options:
        - Individual developer
        - Consultant or agency
        - Technical lead
        - Development team
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example or evidence
      description: Share a sanitized example, frequency, or estimated time/risk reduction.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private source, credentials, customer data, and identifying paths.
          required: true
